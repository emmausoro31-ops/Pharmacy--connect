{% extends "base.html" %}{% block title %}Pharmacies{% endblock %}{% block content %}<section class="section"><h1>Find a pharmacy</h1><form method="get" class="search"><input name="search" value="{{ search }}" placeholder="Search pharmacy name..."><button>Search</button></form><div class="cards">{% for p in pharmacies %}<article class="card"><span class="verified">✓ Verified</span><h2>{{ p.name }}</h2><p>{{ p.address }}</p><a class="button" href="{{ url_for('pharmacy', pharmacy_id=p.id) }}">View pharmacy</a></article>{% else %}<p>No pharmacies found.</p>{% endfor %}</div></section>{% endblock %}
